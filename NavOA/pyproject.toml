[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = 'NavOA'
version = "1.1"
requires-python = ">= 3.10"
description = "NavOA"
readme = "README.md"
dependencies = [
    'cvxpylayers',
    'numpy',
    'scipy',
    'rich',
    'dill',
    'gctl==1.2',
    'colorama',
    'scikit-learn',
    'pyyaml',
    "torch>=2.1.0",
    "ecos",
]

[project.optional-dependencies]
irsim = ['ir-sim>=2.4.0']
all = ['ir-sim>=2.4.0']

[tool.setuptools]
py-modules = ['NavOA']



