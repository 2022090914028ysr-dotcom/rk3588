frequency: 30.0
sensor_timeout: 0.1
two_d_mode: true

odom_frame: odom
base_link_frame: base_link
world_frame: odom

# 雷达伪里程计（来自 rf2o，话题为 /odom）
odom0: /odom
odom0_config: [true,  true,  false,   # x, y
               false, false, true,    # yaw
               false, false, false,   # linear velocity
               false, false, false,   # angular velocity
               false, false, false]   # acceleration
odom0_queue_size: 2
odom0_differential: false
odom0_relative: false

# IMU（话题为 /imu，假设无磁力计）
imu0: /imu
imu0_config: [false, false, false,   # position
              false, false, false,   # orientation（禁用，因无磁力计）
              false, false, false,   # linear velocity
              false, false, true,    # angular_velocity.z（关键！）
              true,  true,  false]   # linear_acceleration.x, y（用于零速修正）
imu0_differential: false
imu0_relative: false
imu0_queue_size: 5

# 从 IMU 加速度中自动扣除重力（假设 IMU 未做重力补偿）
remove_gravitational_acceleration: true
