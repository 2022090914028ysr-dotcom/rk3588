syntax = "proto3";

package cartographer.mapping.constraints.proto;

import "cartographer/mapping/proto/scan_matching/ceres_scan_matcher_options_2d.proto";
import "cartographer/mapping/proto/scan_matching/ceres_scan_matcher_options_3d.proto";
import "cartographer/mapping/proto/scan_matching/fast_correlative_scan_matcher_options_2d.proto";
import "cartographer/mapping/proto/scan_matching/fast_correlative_scan_matcher_options_3d.proto";

message ConstraintBuilderOptions {
  // A constraint will be added if the proportion of added constraints to
  // potential constraints drops below this number.
  double sampling_ratio = 1;

  // Threshold for poses to be considered near a submap.
  double max_constraint_distance = 2;

  // Threshold for the scan match score below which a match is not considered.
  // Low scores indicate that the scan and map do not look similar.
  double min_score = 4;

  // Threshold below which global localizations are not trusted.
  double global_localization_min_score = 5;

  // Weight used in the optimization problem for the translational component of
  // loop closure constraints.
  double loop_closure_translation_weight = 13;

  // Weight used in the optimization problem for the rotational component of
  // loop closure constraints.
  double loop_closure_rotation_weight = 14;

  // If enabled, logs information of loop-closing constraints for debugging.
  bool log_matches = 8;

  // If enabled, a global localization candidate is validated against the
  // relative motion implied by trusted odometry before an INTER_SUBMAP
  // constraint is created. A candidate whose implied motion between the
  // previous and the current node is inconsistent with odometry is rejected,
  // so that a geometrically good but incorrect match never enters the pose
  // graph.
  bool global_localization_odometry_check_enabled = 15;

  // Maximum allowed difference (in meters) between the odometry-implied and the
  // global-localization-implied translation over the previous-node interval.
  double global_localization_max_odometry_translation_error = 16;

  // Maximum allowed difference (in radians) between the odometry-implied and
  // the global-localization-implied rotation over the previous-node interval.
  double global_localization_max_odometry_rotation_error = 17;

  // Number of top candidates extracted by the fast-correlative scan matcher
  // during kidnap-recovery global localization. These are deduplicated and
  // validated for ambiguity before a single candidate is accepted.
  int32 global_localization_recovery_num_candidates = 18;

  // Minimum score margin between the best and the runner-up distinct
  // hypothesis required to accept a recovery localization as unambiguous.
  double global_localization_recovery_min_score_margin = 19;

  // Minimum translational separation (meters) for two candidates to be
  // considered distinct hypotheses during recovery deduplication.
  double global_localization_recovery_min_separation = 20;

  // Minimum angular separation (radians) for two candidates to be considered
  // distinct hypotheses during recovery deduplication.
  double global_localization_recovery_min_angular_separation = 21;

  // Number of consecutive, spatially-consistent recovery localizations
  // required before the localization is declared recovered and normal
  // odometry-gated constraint checking resumes.
  int32 global_localization_recovery_num_confirmations = 22;

  // Maximum translational distance (meters) between consecutive recovery
  // hypotheses for them to count as the same physical localization.
  double global_localization_recovery_confirmation_distance = 23;

  // Minimum scan score for an odometry-inconsistent global match to be treated
  // as a relocalization candidate instead of being rejected outright. A match
  // this confident is likely a genuine re-detection of a distinctive place, so
  // it is routed through temporal confirmation, letting a robot that was
  // wrongly localized recover once it moves somewhere distinctive.
  double global_localization_relocalization_min_score = 24;

  // Options for the internally used scan matchers.
  mapping.scan_matching.proto.FastCorrelativeScanMatcherOptions2D
      fast_correlative_scan_matcher_options = 9;
  mapping.scan_matching.proto.CeresScanMatcherOptions2D
      ceres_scan_matcher_options = 11;
  mapping.scan_matching.proto.FastCorrelativeScanMatcherOptions3D
      fast_correlative_scan_matcher_options_3d = 10;
  mapping.scan_matching.proto.CeresScanMatcherOptions3D
      ceres_scan_matcher_options_3d = 12;
}
