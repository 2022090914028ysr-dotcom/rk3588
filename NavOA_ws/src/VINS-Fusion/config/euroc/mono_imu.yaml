%YAML:1.0

# ==========================================
# 0. !!! 关键修复 !!!
# ==========================================
# VINS-Fusion 必须要这一行才能读取下面的相机参数
# 这里的 "mono_imu.yaml" 必须和你保存的文件名完全一致
cam0_calib: "mono_imu.yaml"

# ==========================================
# 1. 传感器话题与类型
# ==========================================
imu: 1         
num_of_cam: 1  

imu_topic: "/imu"
image0_topic: "/ascamera_hp60c/rgb0/image"  
output_path: "/home/ubuntu/Robit_SlamNav/NavOA_ws/output/"

# [新增] IMU 频率，根据你的标定结果(174.5Hz)取整
# 显式声明频率有助于 VINS 更稳定地初始化
imu_freq: 175

# ==========================================
# 2. 相机内参
# ==========================================
model_type: PINHOLE
camera_name: camera
image_width: 640
image_height: 480

distortion_parameters:
   k1: 0.0
   k2: 0.0
   p1: 0.0
   p2: 0.0

projection_parameters:
   fx: 559.444214
   fy: 558.882202
   cx: 341.099762
   cy: 252.023819


# ==========================================
# 3. 外参 (相机到 IMU 的变换)
# ==========================================
# 0 = 只要外参准，就锁死它！(Have an accurate extrinsic parameters)
estimate_extrinsic: 0

# body_T_cam0: !!opencv-matrix
#    rows: 4
#    cols: 4
#    dt: d
#    data: [  0.004419,  0.114591,  0.993403,  0.226113,
#            -0.999985,  0.003664,  0.004026,  0.012735,
#            -0.003179, -0.993406,  0.114606,  0.306198,
#             0.0,       0.0,       0.0,       1.0 ]

body_T_cam0: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [ -1.9122065088571438e-01, -2.7971070915213017e-02, 9.8114845047357657e-01, 2.1971695566552146e-01,
           -9.8154501603084876e-01, 3.4011993144725805e-03, -1.9120097632654617e-01, 6.9016007011618299e-03,
            2.0110146307409705e-03, -9.9960294669187510e-01, -2.8105244796578388e-02, 2.9659507763149412e-01, 
            0., 0., 0., 1. ]

# ==========================================
# 4. 特征追踪与优化参数
# ==========================================
multiple_thread: 1
max_cnt: 200            
min_dist: 15            
freq: 10                # 这是图像处理频率，不用改
F_threshold: 1.0        
show_track: 1           
flow_back: 1            

max_solver_time: 0.04  
max_num_iterations: 8   
keyframe_parallax: 10.0 

# ========================    ==================
# 5. IMU 噪声参数 (已根据 lpw 标定结果修改)
# ==========================================
# 加速度计高斯白噪声 (avg-axis: acc_n)
# acc_n: 6.57e-03          

# # 陀螺仪高斯白噪声 (avg-axis: gyr_n)
# # 注意：你的Z轴噪声较大(1.44e-03)，如果发现旋转漂移，可尝试将此值增大到 1.5e-03
# gyr_n: 6.17e-04         

# # 加速度计随机游走 (avg-axis: acc_w)
# acc_w: 2.47e-04        

# # 陀螺仪随机游走 (avg-axis: gyr_w)
# gyr_w: 2.19e-05       

# g_norm: 9.81007     

acc_n: 0.20       
gyr_n: 0.02         
acc_w: 2.47e-04        
gyr_w: 2.19e-05       
g_norm: 9.80

# ==========================================
# 6. 时间同步
# ==========================================
estimate_td: 0      
td: 0.0035    

# ==========================================
# 7. 回环检测
# ========================================== 
load_previous_pose_graph: 0        
pose_graph_save_path: "/home/ubuntu/Robit_SlamNav/NavOA_ws/output/pose_graph/"
save_image: 1