frequency: 30.0
sensor_timeout: 0.2
two_d_mode: true

odom_frame: odom
base_link_frame: base_footprint
world_frame: odom

# ----------------------------------------
# 轮式里程计：只负责位移 (X, Y, VX, VY)
# ----------------------------------------
odom0: /odom
odom0_config: [true,  true,  false,   # X, Y
               false, false, false,   
               true,  true,  false,   # VX, VY
               false, false, false,   
               false, false, false]
odom0_queue_size: 10
odom0_differential: false
odom0_relative: false

# ----------------------------------------
# IMU：只负责旋转 (角速度)
# ----------------------------------------
imu0: /imu
# 修改点：只融合角速度 (Yaw Rate)，不融合 Yaw
imu0_config: [false, false, false,
              false, false, false,    # 关掉 Yaw (因为下面用了角速度)
              false, false, false,
              false, false, true,     # 开启 Yaw Velocity (角速度)
              false, false, false]  
# 修改点：既然只融合角速度，differential 就不需要了，
# 或者是设为 false，防止意外行为
imu0_differential: false 
imu0_relative: true           # 建议设为 true，消除上电时的绝对角度偏差
imu0_queue_size: 10
imu0_remove_gravitational_acceleration: true # 建议由 EKF 内部处理重力