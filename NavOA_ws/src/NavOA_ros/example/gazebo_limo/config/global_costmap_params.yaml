global_costmap:
  global_frame: map
  robot_base_frame: base_link
  update_frequency: 5          # 5 → 1：全局层无需高频更新，省 CPU
  publish_frequency: 5        # 2 → 1
  transform_tolerance: 0.5
  
  

  plugins:
    - {name: static_layer, type: "costmap_2d::StaticLayer"}
    - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
    

  static_map: true  
  rolling_window: false  
  

  static_layer:
    map_topic: "/map"
    subscribe_to_updates: false
    track_unknown_space: true
    trinary_costmap: true
    lethal_cost_threshold: 50
    unknown_cost_value: -1

  # Feed live obstacles into the global planner.  Previously only the local
  # costmap/NavOA saw them, so global replanning repeatedly selected the same
  # blocked route.
  obstacle_layer:
    enabled: true
    observation_sources: scan depth_cloud
    footprint_clearing_enabled: true
    combination_method: 1
    scan:
      data_type: LaserScan
      topic: /scan
      marking: true
      clearing: true
      inf_is_valid: true
      max_obstacle_height: 2.0
      min_obstacle_height: 0.0
      expected_update_rate: 0.0
      observation_persistence: 0.0
      obstacle_range: 2.5
      raytrace_range: 3.0
    # 深度相机障碍物点云（ground_segmentation 已剔除地面），只标记；清除交给激光
    depth_cloud:
      data_type: PointCloud2
      topic: /obstacle_points
      marking: true
      clearing: false
      min_obstacle_height: 0.05
      max_obstacle_height: 2.0
      obstacle_range: 2.5
      raytrace_range: 3.0
      expected_update_rate: 0.0
      observation_persistence: 0.0   # 全局层更新慢，持久期略长
    
  inflation_layer:
    # Match the local costmap.  The previous 0.35 m radius could surround the
    # robot with stale inflated costs even after the physical obstacle moved.
    inflation_radius: 0.12
    cost_scaling_factor: 10.0
    inscribed_radius: 0.10
    
  # 可选：发布话题配置
  always_send_full_costmap: true  
