# 机器人几何参数 (必须有，否则膨胀层不知道怎么算)
# 机器人外形（以 base_footprint 为中心）
# 你的机器人: 长 0.20m(x), 宽 0.30m(y)
# 半尺寸: x=0.10, y=0.15
footprint: [[0.30, 0.30], [0.30, -0.30], [-0.30, -0.30], [-0.30, 0.30]]
# 或者用半径: robot_radius: 0.2

# 安全裕量：在机器人几何外再“扩一圈”，减少贴墙/擦碰。
# 如果你想“机器人本体”与墙保持约 0.20m 间距，可以设置为 0.20。
# 注意：这会让机器人在狭窄通道里更容易判定不可通过。
footprint_padding: 0.05

# 膨胀半径 (通用设置)
inflation_radius: 0.55
cost_scaling_factor: 1.2

# 这里的 scan 配置其实对于"只做静态全局规划"不是必须的
# 但如果您想留着，必须写对格式
map_type: costmap

