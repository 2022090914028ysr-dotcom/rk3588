# mpc
receding: 5
step_time: 0.3
ref_speed: 1.5
device: 'cpu'
time_print: False
collision_threshold: -1.0

# robot
robot:
  kinematics: 'diff'
  max_speed: [0.3, 1.0]
  max_acce: [0.3, 1.2]
  length: 0.60
  width: 0.30

# initial path
ipath:
  interval: 0.09
  waypoints: []
  curve_style: 'line'   # 'dubins' or reeds or line
  min_radius: 0.0
  loop: false
  arrive_threshold: 0.3
  close_threshold: 0.1
  arrive_index_threshold: 3
  ind_range: 30
  max_tracking_distance: 1.0
  
# proximal alternating minimization network
pan:
  iter_num: 2
  dune_max_num: 100
  nrmp_max_num: 10
  dune_checkpoint: None
  iter_threshold: 0.1

# adjust parameters
adjust:
  q_s: 0.35
  p_u: 2.5
  eta: 15
  d_max: 0.03
  d_min: 0.01
