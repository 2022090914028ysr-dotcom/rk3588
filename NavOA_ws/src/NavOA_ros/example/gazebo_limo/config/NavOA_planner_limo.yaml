# mpc
receding: 5
step_time: 0.3
ref_speed: 0.15
device: 'cpu'
time_print: False
collision_threshold: -0.5

# robot
robot:
  kinematics: 'diff'
  max_speed: [0.4, 1]
  max_acce: [0.5, 1]
  length: 0.8
  width: 0.5

# initial path
ipath:
  interval: 0.09
  waypoints: []
  curve_style: 'line'   # 'dubins' or reeds or line
  min_radius: 0.0
  loop: False
  arrive_threshold: 1.0
  close_threshold: 0.1
  arrive_index_threshold: 3
  
# proximal alternating minimization network
pan:
  iter_num: 2
  dune_max_num: 100
  nrmp_max_num: 10
  dune_checkpoint: None
  iter_threshold: 0.1

# adjust parameters
adjust:
  q_s: 0.3
  p_u: 2.5
  eta: 10.0
  d_max: 0.15
  d_min: 0.01
