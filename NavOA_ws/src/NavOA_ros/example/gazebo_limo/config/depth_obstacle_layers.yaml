stvl_layer:
  enabled: true
  publish_voxel_map: false

  # 几何
  origin_z: -0.10
  z_resolution: 0.15
  z_voxels: 16
  max_obstacle_height: 2.0
  mark_threshold: 0

  # 时间衰减（核心）
  decay_model: 0        # 0=linear, 1=exponential, 2=publish（以你的版本枚举为准）
  voxel_decay: 0.8      # 秒；看不到 0.3s 后开始衰减

  # 观测源
  observation_sources: depth_mark depth_clear

  depth_mark:
    data_type: PointCloud2
    topic: /obstacle_points
    marking: true
    clearing: false
    obstacle_range: 2.5
    observation_persistence: 0.0
    expected_update_rate: 0.0

  depth_clear:
    data_type: PointCloud2
    topic: /depth/clearing_points
    marking: false
    clearing: true
    raytrace_range: 3.0
    observation_persistence: 0.0
    expected_update_rate: 0.0