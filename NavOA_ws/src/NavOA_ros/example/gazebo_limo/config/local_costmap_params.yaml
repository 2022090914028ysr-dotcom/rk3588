local_costmap:
  # Odom 在 map->odom 定位修正期间保持连续
  global_frame: odom
  robot_base_frame: base_link
  # 局部避障由 NavOA 直接融合 /obstacle_points 完成,move_base 的 cmd_vel 已重映射到
  # 虚拟话题;local costmap 无任何外部订阅者。update/publish 置 0 关闭其定时器,
  # 省下的 CPU 让给 global costmap 的 3Hz 更新。如需恢复改为 5.0/5.0。
  update_frequency: 0.0
  publish_frequency: 0.0
  transform_tolerance: 0.5

  static_map: false
  rolling_window: true
  track_unknown_space: false

  width: 6.0
  height: 6.0
  resolution: 0.05

  plugins:
    - {name: obstacle_layer,  type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

  obstacle_layer:
    enabled: true
    track_unknown_space: false
    combination_method: 1
    footprint_clearing_enabled: true
    observation_sources: scan
    scan:
      data_type: LaserScan
      topic: /scan
      marking: true
      clearing: true
      inf_is_valid: true
      min_obstacle_height: -0.2
      max_obstacle_height: 2.0
      obstacle_range: 4.5
      raytrace_range: 5.0
      observation_persistence: 0.0
      expected_update_rate: 0.0

  inflation_layer:
    enabled: true
    inflation_radius: 0.30
    cost_scaling_factor: 8.0