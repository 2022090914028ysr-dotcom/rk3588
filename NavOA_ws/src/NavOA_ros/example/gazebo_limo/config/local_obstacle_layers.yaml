# Local costmap safety layer. Depth obstacles are fused directly into NavOA.
obstacle_layer:
  enabled: true
  track_unknown_space: false
  combination_method: 1
  footprint_clearing_enabled: true
  observation_sources: scan
  scan:
    data_type: LaserScan
    topic: /scan
    marking: true
    clearing: true
    inf_is_valid: true
    min_obstacle_height: -0.2
    max_obstacle_height: 2.0
    obstacle_range: 4.5
    raytrace_range: 5.0
    observation_persistence: 0.0
    expected_update_rate: 0.0
