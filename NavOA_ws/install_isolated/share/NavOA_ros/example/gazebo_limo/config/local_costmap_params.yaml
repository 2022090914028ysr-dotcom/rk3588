    enabled: true
    observation_sources: camscan
    camscan:
      data_type: LaserScan
      topic: /camscan
      marking: true
      clearing: true
      inf_is_valid: true
      max_obstacle_height: 2.0
      min_obstacle_height: 0.05   # Ìù½üµØÃæ£¬¼ì²â°«Ð¡ÕÏ°­Îï
      expected_update_rate: 0
      obstacle_range: 2.0          # Ïà»úÓÐÐ§Ì½²â¾àÀë
      raytrace_range: 2.5

  inflation_layer:
    enabled: true
    inflation_radius: 0.40
    cost_scaling_factor: 2.0